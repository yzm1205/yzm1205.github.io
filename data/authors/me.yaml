experience:
  - role: Postdoctoral Researcher / AI Engineer, BridgeAI Lab
    org: University of Central Florida
    start: 2025-12-01
    summary: |
      - Lead the design of LLMCompass, a research platform for studying capability-aware and
        resource-aware selection among more than 50 language models across more than 25 task skills.
      - Develop research protocols for evaluating instruction adherence, response quality, semantic
        alignment, ranking stability, and task–model fit across multiple datasets and model families.
      - Build reproducible multi-model and multi-dataset evaluation pipelines using PyTorch,
        Hugging Face, vLLM, FastAPI, PostgreSQL, Docker, Slurm, and multi-GPU infrastructure.
      - Implement scalable inference and model-sharding workflows for large-model experimentation
        on H100 and NSF-supported computing resources.
      - Design modular experiment infrastructure recording model, prompt, dataset, hardware,
        latency, throughput, and quality metadata for controlled comparative studies.
      - Investigate automated mappings from user intent to capability requirements, model rankings,
        and deployment configurations.
      - Collaborate on research using topological data analysis to study and optimize model
        training behavior.
  - role: Graduate Teaching Assistant, Computer Science and Software Engineering
